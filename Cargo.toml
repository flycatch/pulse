[package]
name = "pulse"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/flycatch/pulse"

[dependencies]
dirs = "7.0.0"
font8x8 = "0.3.1"
softbuffer = "0.4.8"
sysinfo = { version = "0.40.4", default-features = false, features = ["network", "system", "disk"] }
tao = "0.37.2"
tray-icon = "0.26.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
