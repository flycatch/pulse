name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          name=pulse-${{ matrix.target }}
          tar -C target/${{ matrix.target }}/release -czf $name.tar.gz pulse
          shasum -a 256 $name.tar.gz > $name.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            pulse-${{ matrix.target }}.tar.gz
            pulse-${{ matrix.target }}.tar.gz.sha256
